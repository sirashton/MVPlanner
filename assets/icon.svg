<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="MVPlanner">
  <title>MVPlanner</title>
  <!-- The critical path steps down through a 3x3 grid of tasks, tracing an M; tasks it skips are smaller Should and Could dots on faint links to their parents. -->
  <rect x="0.3" y="0.3" width="31.4" height="31.4" rx="7.5" fill="#ffffff" stroke="#d9dfe7" stroke-width="0.6"/>
  <path d="M8.5 8.5V23.5M16 16V23.5M16 8.5H23.5" stroke="#5d6b7c" stroke-opacity=".45" stroke-width="1.4" stroke-linecap="round" fill="none"/>
  <path d="M8.5 8.5H16V16H23.5V23.5" stroke="#3b3fb6" stroke-width="3.2" fill="none" stroke-linejoin="round" stroke-linecap="round"/>
  <circle cx="8.5" cy="16" r="1.9" fill="#1d7570"/><circle cx="23.5" cy="8.5" r="1.9" fill="#1d7570"/>
  <circle cx="8.5" cy="23.5" r="1.9" fill="#c9861c"/><circle cx="16" cy="23.5" r="1.9" fill="#c9861c"/>
  <circle cx="8.5" cy="8.5" r="2.6" fill="#3b3fb6"/><circle cx="16" cy="8.5" r="2.6" fill="#3b3fb6"/><circle cx="16" cy="16" r="2.6" fill="#3b3fb6"/><circle cx="23.5" cy="16" r="2.6" fill="#3b3fb6"/><circle cx="23.5" cy="23.5" r="2.6" fill="#3b3fb6"/>
</svg>
