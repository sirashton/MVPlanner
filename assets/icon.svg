<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="MVPlanner">
  <title>MVPlanner</title>
  <!-- The M drawn as a route through task nodes: the critical path lit in Must indigo, then a Should and a Could node. -->
  <rect width="32" height="32" rx="7.5" fill="#1d2a3a"/>
  <path d="M16 18L24 9V24" stroke="#5d6b7c" stroke-width="2.6" fill="none" stroke-linejoin="round" stroke-linecap="round"/>
  <path d="M8 24V9L16 18" stroke="#9da2ff" stroke-width="3" fill="none" stroke-linejoin="round" stroke-linecap="round"/>
  <circle cx="8" cy="24" r="2.2" fill="#9da2ff"/><circle cx="8" cy="9" r="2.6" fill="#9da2ff"/><circle cx="16" cy="18" r="2.6" fill="#9da2ff"/>
  <circle cx="24" cy="9" r="2.4" fill="#5cc4bb"/><circle cx="24" cy="24" r="2.2" fill="#e0a54a"/>
</svg>
