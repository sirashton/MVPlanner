<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16">
  <!-- The MVPlanner tree on a 16px grid: the top task, three subtasks, and the critical path down to one leaf. -->
  <style>.m { fill: #3b3fb6 } @media (prefers-color-scheme: dark) { .m { fill: #9da2ff } }</style>
  <rect class="m" x="4" y="0" width="8" height="3" rx="1"/>
  <rect class="m" x="7" y="3" width="2" height="3"/>
  <rect x="0" y="6" width="4" height="3" rx="1" fill="#1d7570"/>
  <rect class="m" x="5" y="6" width="6" height="4" rx="1"/>
  <rect x="12" y="6" width="4" height="3" rx="1" fill="#8a5a0f"/>
  <rect class="m" x="7" y="10" width="2" height="3"/>
  <rect class="m" x="7" y="12" width="7" height="4" rx="1"/>
</svg>
